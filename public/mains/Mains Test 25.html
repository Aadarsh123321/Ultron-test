const TEST_STORAGE_ID="embedded-jee-cbt-Mains_Test_25"; let current=0, submitted=false, remaining=10800, timerId=null, visited=Array(QUESTIONS.length).fill(false), lastTick=Date.now(), subjectTime={};
const answers=Array(QUESTIONS.length).fill(null), reviewed=Array(QUESTIONS.length).fill(false);
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
function subjects(){return [...new Set(QUESTIONS.map(q=>q.subject))]} function initSubjectTime(){subjects().forEach(s=>{if(typeof subjectTime[s]!=='number')subjectTime[s]=0})}
function answered(i){let a=answers[i]; return a!==null && (!(Array.isArray(a)) || a.length>0) && String(a).trim()!==''}
function renderTabs(){ $('#tabs').innerHTML=subjects().map((s,i)=>`<button class="tab ${i===0?'active':''}" onclick="filterSub('${s}',this)">${s}</button>`).join('') }
let activeSubject='Physics';
function filterSub(s,el){activeSubject=s; $$('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active'); let first=QUESTIONS.findIndex(q=>q.subject===s); if(first>=0) current=first; render()}
function renderPalette(){
  const groups=subjects().map(subject=>({subject,items:QUESTIONS.map((q,i)=>({q,i})).filter(x=>x.q.subject===subject)}));
  $('#palette').innerHTML=groups.map(g=>{
    const a=g.items[0].i+1,b=g.items[g.items.length-1].i+1;
    return `<div class="palette-group"><div class="palette-heading"><b>${g.subject}</b><span>${a}–${b}</span></div><div class="palette-grid">${g.items.map(({q,i})=>{let c=answered(i)?'answered':'notvisited';if(visited[i]&&!answered(i))c='notanswered';if(reviewed[i])c=answered(i)?'both':'review';return `<button class="qbtn ${c} ${i===current?'current':''}" onclick="go(${i})">${i+1}</button>`}).join('')}</div></div>`;
  }).join('');
}
function render(){let q=QUESTIONS[current];visited[current]=true;initSubjectTime();$('#qnum').textContent=`Question ${current+1}`;$('#subject').textContent=q.subject;$('#type').textContent=q.type==='Multiple'?'Multiple Correct':q.type==='Numeric'?'Numerical':'Single Correct';$('#marks').textContent=`Marks: +${Number(q.positiveMarks??4)}/${Number(q.negativeMarks??0)===0?'0':'-'+Number(q.negativeMarks??0)}`;$('#question').innerHTML=(q.questionImages?.en||[]).map(u=>`<img src="${u}" loading="lazy">`).join('');
let old=answers[current]; if(q.type==='Multiple'){let ids=q.options.map(o=>o.id);$('#inputArea').innerHTML=`<div class="options">${q.options.map(o=>`<label class="opt"><input type="checkbox" value="${o.id}" ${Array.isArray(old)&&old.includes(o.id)?'checked':''} onchange="capture()"><span>${o.text}</span></label>`).join('')}</div>`}else if(q.type==='Numeric'){$('#inputArea').innerHTML=`<input id="num" class="num" inputmode="decimal" placeholder="Enter numerical answer" value="${old??''}" oninput="capture()">`}else{$('#inputArea').innerHTML=`<div class="options">${q.options.map(o=>`<label class="opt"><input type="radio" name="singleOption" value="${o.id}" ${old===o.id?'checked':''} onchange="capture()"><span>${o.text}</span></label>`).join('')}</div>`}
$('#reviewState').textContent=reviewed[current]?'Marked for review':'';$('#prev').disabled=current===0;$('#next').disabled=current===QUESTIONS.length-1;renderPalette();updateRight()}
function capture(){let q=QUESTIONS[current];if(q.type==='Multiple') answers[current]=$$('#inputArea input:checked').map(x=>x.value);else if(q.type==='Numeric') answers[current]=$('#num').value.trim();else{let x=$('#inputArea input:checked');answers[current]=x?x.value:null}persistDraft();renderPalette()}
function persistDraft(){try{localStorage.setItem(TEST_STORAGE_ID+'_draft',JSON.stringify({testId:TEST_STORAGE_ID,answers:[...answers],reviewed:[...reviewed],visited:[...visited],current,remaining,subjectTime}))}catch(e){}}
function restoreDraft(){try{const d=JSON.parse(localStorage.getItem(TEST_STORAGE_ID+'_draft')||'null');if(d&&d.testId===TEST_STORAGE_ID){for(let i=0;i<answers.length;i++)answers[i]=d.answers?.[i]??null;for(let i=0;i<reviewed.length;i++)reviewed[i]=!!d.reviewed?.[i];for(let i=0;i<visited.length;i++)visited[i]=!!d.visited?.[i];if(d.subjectTime)subjectTime={...subjectTime,...d.subjectTime};if(Number.isFinite(d.remaining))remaining=d.remaining;if(Number.isInteger(d.current)&&d.current>=0&&d.current<QUESTIONS.length)current=d.current}}catch(e){}}
function clearAns(){answers[current]=null;render()}
function go(i){current=i;activeSubject=QUESTIONS[i].subject;$$('.tab').forEach(x=>x.classList.toggle('active',x.textContent===activeSubject));render()}
function saveNext(){capture(); if(current<QUESTIONS.length-1){current++;render()}else{submitTest()}}
function markReview(){reviewed[current]=!reviewed[current];render()}
function updateRight(){let at=answers.filter((a,i)=>answered(i)).length;$('#attempted').textContent=at;$('#unattempted').textContent=QUESTIONS.length-at}
function formatTime(x){let h=Math.floor(x/3600),m=Math.floor(x%3600/60),s=x%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function tick(){let now=Date.now(),dt=Math.min(1000,Math.max(0,now-lastTick));lastTick=now;subjectTime[QUESTIONS[current].subject]=(subjectTime[QUESTIONS[current].subject]||0)+dt/1000;remaining--;persistDraft();$('#timer').textContent=formatTime(remaining);if(remaining<=0){clearInterval(timerId);submitTest(true)}}
function equalSets(a,b){return a.length===b.length&&a.every(x=>b.includes(x))}
function isCorrect(q,a){if(q.type==='Numeric') return String(a??'').trim()===String(q.correctText??'').trim(); if(q.type==='Multiple'||q.type==='MatchingList') return Array.isArray(a)&&equalSets(a,q.correctOptionIds||[q.correctOptionId]); return a===q.correctOptionId}
function scoreFor(q,a){let pos=Number(q.positiveMarks??4),neg=Number(q.negativeMarks??0);if(!answeredValue(a))return 0;if(isCorrect(q,a))return pos;return -neg}
function answeredValue(a){return a!==null && (!(Array.isArray(a))||a.length>0)&&String(a).trim()!==''}
function band(p){if(p>=80)return'Excellent';if(p>=70)return'Good';if(p>=60)return'Good';if(p>=50)return'Needs Improvement';return'Needs Improvement'}
function submitTest(auto=false){if(submitted)return;capture();submitted=true;clearInterval(timerId);let total=0,max=0,by={};let used=10800-remaining;QUESTIONS.forEach((q,i)=>{let maxq=Number(q.positiveMarks??4);max+=maxq;let sc=scoreFor(q,answers[i]);total+=sc;if(!by[q.subject])by[q.subject]={score:0,max:0,correct:0,wrong:0,attempted:0};by[q.subject].score+=sc;by[q.subject].max+=maxq;if(answeredValue(answers[i])){by[q.subject].attempted++;if(isCorrect(q,answers[i]))by[q.subject].correct++;else by[q.subject].wrong++}});renderResult(total,max,by,auto,used);persistResult(total,max,by,used)}
function renderResult(total,max,by,auto,used){
    $('#exam').classList.add('hidden');
    $('#result').style.display='block';
    $('#timer').style.display='none';
    $('#submit').textContent='Reattempt';
    $('#submit').onclick=reattempt;
    $('#submit').style.display='inline-block';
    let pct=max?Math.max(0,total/max*100):0;
    $('#finalScore').textContent=`${total} / ${max}`;
    $('#finalPct').textContent=`${pct.toFixed(1)}% · Time used ${formatTime(used)}`;
    $('#finalBand').textContent=band(pct)+(auto?' · Time ended':'');
    
    by = by || {};
    $('#subjects').innerHTML=subjects().map(s=>{
        let x=by[s]||{score:0,max:0,correct:0,wrong:0};
        let p=x.max?Math.max(0,x.score/x.max*100):0;
        return `<div class="subject"><b>${s}</b><div class="score" style="font-size:25px">${x.score} / ${x.max}</div><div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%;"></i></div><div class="muted">${p.toFixed(1)}% · ${band(p)} · ${x.correct} correct · ${x.wrong} wrong · Time ${formatTime(subjectTime[s]||0)}</div></div>`
    }).join('');

    function getOptTxt(q, ids){
        if(ids===null||ids===undefined||ids==='')return '—';
        if(q.type==='Numeric') return String(ids);
        let mapId = (id) => {
            let idx=(q.options||[]).findIndex(o=>o.id===id);
            return idx>=0?String.fromCharCode(65+idx):id;
        };
        if(Array.isArray(ids)) return ids.map(mapId).join(', ');
        return mapId(ids);
    }

    $('#analysis').innerHTML=QUESTIONS.map((q,i)=>{
        let ansVal = answers[i];
        if (Array.isArray(ansVal) && ansVal.length === 0) ansVal = null;
        let att = (ansVal !== null && ansVal !== undefined && ansVal !== '');
        let ok = att && isCorrect(q,ansVal);
        let status = !att?'UNATTEMPTED':ok?'CORRECT':'INCORRECT';
        let cls = status==='CORRECT'?'correct':status==='INCORRECT'?'wrong':'';
        let ua = att ? getOptTxt(q, ansVal) : '—';
        let ca = q.type==='Numeric' ? q.correctText : getOptTxt(q, q.correctOptionIds||[q.correctOptionId]);
        return `<div class="review-item ${cls}"><div class="label ${status==='CORRECT'?'good':status==='INCORRECT'?'bad':''}">${status}</div><h3>Question ${i+1} · ${q.subject}</h3><div>${(q.questionImages?.en||[]).map(u=>`<img src="${u}" loading="lazy">`).join('')}</div><div class="answerline"><b>Your answer:</b> ${ua} &nbsp; <b>Correct:</b> ${ca}</div><button class="action" onclick="this.nextElementSibling.classList.toggle('hidden')">See Solution</button><div class="solution hidden">${(q.solutionImages?.en||[]).map(u=>`<img src="${u}" loading="lazy">`).join('')}</div></div>`
    }).join('');
}
function persistResult(total,max,by,used){const payload={version:1,testId:TEST_STORAGE_ID,submittedAt:new Date().toISOString(),score:total,maxScore:max,timeUsed:used,subjectTime:{...subjectTime},subjects:by,answers:[...answers],reviewed:[...reviewed]};try{localStorage.setItem(TEST_STORAGE_ID+'_result',JSON.stringify(payload));}catch(e){} try{if(typeof window.CBT_SAVE_RESULT==='function')window.CBT_SAVE_RESULT(payload);else if(window.parent&&typeof window.parent.CBT_SAVE_RESULT==='function')window.parent.CBT_SAVE_RESULT(payload); }catch(e){} try{window.dispatchEvent(new CustomEvent('jee-cbt-result',{detail:payload}));}catch(e){}}
function reattempt(){
  submitted=false; current=0; remaining=10800; visited.fill(false); reviewed.fill(false); answers.fill(null); subjectTime={};initSubjectTime();
  try{localStorage.removeItem(TEST_STORAGE_ID+'_draft');localStorage.removeItem(TEST_STORAGE_ID+'_result')}catch(e){}
  $('#result').style.display='none';$('#exam').classList.remove('hidden');$('#timer').style.display='inline-block';$('#submit').textContent='Submit';$('#submit').onclick=()=>submitTest(false);lastTick=Date.now();render();$('#timer').textContent=formatTime(remaining);timerId=setInterval(tick,1000);
}
function start(){initSubjectTime();restoreDraft();let res=localStorage.getItem(TEST_STORAGE_ID+'_result');if(res){try{let r=JSON.parse(res);renderResult(r.score,r.maxScore,r.subjects,true,r.timeUsed||0);return;}catch(e){}}renderTabs();render();$('#timer').textContent=formatTime(remaining);lastTick=Date.now();timerId=setInterval(tick,1000)}
$('#prev').onclick=()=>{capture();if(current>0){current--;render()}};$('#next').onclick=()=>{capture();if(current<QUESTIONS.length-1){current++;render()}};$('#clear').onclick=clearAns;$('#save').onclick=saveNext;$('#review').onclick=markReview;$('#submit').onclick=()=>submitTest(false);start();
</script></body></html>
