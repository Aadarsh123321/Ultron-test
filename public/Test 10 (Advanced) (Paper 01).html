const TEST_STORAGE_ID="embedded-jee-cbt-Test_10_Advanced_Paper_01"; let current=0, submitted=false, remaining=10800, timerId=null, visited=Array(QUESTIONS.length).fill(false), lastTick=Date.now(), subjectTime={};
